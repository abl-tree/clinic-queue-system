name: Daily Queue Cleanup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel queue cleanup
        run: curl -X POST '${{ secrets.VERCEL_CLEANUP_URL }}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
