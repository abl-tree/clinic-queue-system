name: Daily Queue Cleanup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel queue cleanup
        env:
          CLEANUP_URL: ${{ secrets.VERCEL_CLEANUP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: curl -X POST "$CLEANUP_URL" -H "Authorization: Bearer $CRON_SECRET"
